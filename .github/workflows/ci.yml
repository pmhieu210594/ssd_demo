# ============================================
# EDCAP Frontend - GitHub Actions CI Pipeline
# ============================================
# Run CI when a pull request targets main
# Steps:
# - Install dependencies
# - Lint
# - Unit Test
# - Build
# - Start Backend stack by Docker Compose
# - Run Playwright E2E tests

name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  VITE_URL_API: 'http://localhost:8080'
  VITE_URL_EDCAP: 'http://localhost:4001'
  VITE_STATUS: STAGING
  VITE_URL_LANGUAGES: en,vi,ja
  VITE_URL_LANGUAGE: vi
  VITE_APP_NAME: Brycen
  VITE_APP_FORMAT_DATE: YYYY-MM-DD
  VITE_PORT: '5173'

jobs:
  # ============================================
  # VALIDATE JOB
  # ============================================
  validate:
    name: Lint, Unit Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build
  # ============================================
  # E2E JOB
  # ============================================
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout frontend source code
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BE_DOCKERHUB_TOKEN }}

      - name: Start backend stack
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_KEY_STRING: ${{ secrets.SECRET_KEY_STRING }}
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          docker compose -f docker-compose.e2e.yml ps

      - name: Wait for backend healthy
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend... ($i/60)"
            sleep 3
          done

          echo "=== Docker containers ==="
          docker ps -a

          echo "=== Backend container logs ==="
          docker logs edcap_backend 2>&1 || true

          echo "=== Backend container inspect ==="
          docker inspect edcap_backend 2>&1 || true

          echo "Backend did not become healthy in time"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: ./test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Docker
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
