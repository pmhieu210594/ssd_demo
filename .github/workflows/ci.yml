name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend - UT, IT and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.SPRING_DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          POSTGRES_DB: sdd_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ vars.SPRING_DATASOURCE_USERNAME }} -d sdd_platform"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      SECRET_KEY_STRING: ${{ secrets.SECRET_KEY_STRING }}

    steps:
      - name: Checkout backend source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run unit tests, integration tests and build
        run: mvn clean verify

      - name: Print test summary
        if: always()
        run: |
          echo "## Maven Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Unit Tests - Surefire" >> $GITHUB_STEP_SUMMARY
          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            grep -h "Tests run:" target/surefire-reports/*.txt >> $GITHUB_STEP_SUMMARY || true
          else
            echo "No Surefire report found." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Integration Tests - Failsafe" >> $GITHUB_STEP_SUMMARY
          if ls target/failsafe-reports/*.txt >/dev/null 2>&1; then
            grep -h "Tests run:" target/failsafe-reports/*.txt >> $GITHUB_STEP_SUMMARY || true
          else
            echo "No Failsafe report found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: backend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout backend source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            khactrung0608/edcap-be:main
            khactrung0608/edcap-be:latest